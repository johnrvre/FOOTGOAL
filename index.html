<header>
  <h1 class="neon-title">FOOTGOAL</h1>
</header>

<main>

  <!-- ACCUEIL -->
  <section id="home" class="card">
    <h2>Bienvenue dans le Quiz Foot !</h2>

    <p>Sélectionne le nombre de joueurs :</p>

    <select id="player-count">
      <option value="2">2 joueurs</option>
      <option value="3">3 joueurs</option>
      <option value="4">4 joueurs</option>
    </select>

    <div id="player-names" class="player-inputs"></div>

    <button id="play-btn" class="btn-primary">
      🎮 Jouer
    </button>
  </section>


  <!-- TRANSITION -->
  <section id="turn-transition" class="card hidden">
    <h2 id="next-player-text">
      C’est au tour de...
    </h2>
  </section>


  <!-- JEU -->
  <section id="game" class="card hidden">

    <div class="progress-container">
      <div id="progress-text">
        Question 1 / 5
      </div>

      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>
    </div>

    <h2 id="question" class="question">
      Chargement...
    </h2>

    <div id="answers" class="answers-grid"></div>

    <div id="timer" class="timer">
      ⏱️ Temps restant :
      <span id="time">10</span>s
    </div>

  </section>


  <!-- RÉSULTATS -->
  <section id="results" class="card hidden">

    <h2>🏁 Fin du quiz !</h2>

    <p class="winner-text">
      🏆 <span id="winner">?</span>
    </p>

    <div
      id="score-summary"
      class="score-summary">
    </div>

    <button
      id="restart-btn"
      class="btn-primary">
      🔁 Rejouer
    </button>

    <button
      id="home-btn"
      class="btn-secondary">
      🏠 Retour à l’accueil
    </button>

  </section>

</main>
